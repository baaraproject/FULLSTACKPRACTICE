<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table html</title>
</head>
<body>
    <table>
        <section>
            Maryland Senior High School
        </section>
        <thead>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th>Score</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aaron</td>
                <td>80</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bethany</td>
                <td>75</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Cynthia</td>
                <td>90</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>--</td>
            </tr>
        </tfoot>
    </table>
    <table border="1">
        <thead>
            <tr>
                <th rowspan="2">No</th>
                <th rowspan="2">Name</th>
                <th colspan="3">Class</th>
            </tr>
            <tr>
                <th>2024</th>
                <th>2025</th>
                <th>2026</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Anne Hataway</td>
                <td>2024</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>2</td>
                <td>Bella</td>
                <td></td>
                <td>2025</td>
                <td></td>
            </tr>
            <tr>
                <td>3</td>
                <td>Chintya</td>
                <td></td>
                <td></td>
                <td>2026</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
